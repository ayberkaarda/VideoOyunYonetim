# Local SQL Server for development.
#
#   Copy-Item db/.env.example db/.env      # then set a password
#   docker compose -f db/docker-compose.yml up -d
#   docker compose -f db/docker-compose.yml ps
#
# Data lives in the named volume `vgm-data`, so `down` keeps it and `down -v`
# destroys it.
#
# MSSQL_COLLATION sets the *server* collation, which tempdb inherits. It is
# applied only when the volume is first initialised; changing it later requires
# `down -v`. The database itself sets its own collation in db/schema.sql, and
# matching the two avoids collation conflicts when a query joins a temp table.

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: vgm-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in db/.env}
      MSSQL_PID: Express
      MSSQL_COLLATION: Latin1_General_100_CI_AI
    ports:
      - "1433:1433"
    volumes:
      - vgm-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

volumes:
  vgm-data:
