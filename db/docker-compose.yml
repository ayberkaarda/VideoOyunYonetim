# Local SQL Server for development.
#
#   Copy-Item db/.env.example db/.env      # then set a password
#   docker compose -f db/docker-compose.yml up -d
#   docker compose -f db/docker-compose.yml ps
#
# Data lives in the named volume `videooyun-data`, so `down` keeps it and
# `down -v` destroys it.

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: videooyun-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in db/.env}
      MSSQL_PID: Express
    ports:
      - "1433:1433"
    volumes:
      - videooyun-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

volumes:
  videooyun-data:
