<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="title">
  <!-- Video Game Manager logo: three game cases fanned out like a collection, the front one
       carrying a controller. The same geometry as tools/LogoRenderer/LogoPainter.cs, which
       is the source of truth for the generated app.ico and logo-256.png. -->
  <title id="title">Video Game Manager</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="8" x2="0" y2="248" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2A7DE1"/>
      <stop offset="1" stop-color="#0A56B4"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#tile)"/>
  <rect x="32" y="64" width="128" height="160" rx="14" fill="#8FBAEE" transform="rotate(24 160 224)"/>
  <rect x="32" y="64" width="128" height="160" rx="14" fill="#C6DCF8" transform="rotate(12 160 224)"/>
  <rect x="32" y="64" width="128" height="160" rx="14" fill="#FFFFFF"/>
  <rect x="40" y="80" width="8" height="128" fill="#E7F0FC"/>
  <g fill="#0B63CE">
    <rect x="56" y="120" width="96" height="40" rx="20"/>
    <circle cx="76" cy="156" r="20"/>
    <circle cx="132" cy="156" r="20"/>
  </g>
  <g fill="#FFFFFF">
    <rect x="66" y="135" width="28" height="10"/>
    <rect x="75" y="126" width="10" height="28"/>
    <circle cx="121" cy="146" r="6"/>
    <circle cx="135" cy="133" r="6"/>
  </g>
</svg>
